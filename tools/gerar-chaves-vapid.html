<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gerador de chaves VAPID</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #111111;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
      color: #cccccc;
    }

    button {
      width: 100%;
      margin: 24px 0;
      padding: 17px;
      border: 0;
      border-radius: 14px;
      background: #ffffff;
      color: #111111;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    label {
      display: block;
      margin-top: 22px;
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid #444444;
      border-radius: 12px;
      background: #1b1b1b;
      color: #ffffff;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      word-break: break-all;
    }

    .warning {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      background: #332400;
      color: #ffd666;
      line-height: 1.5;
    }

    .success {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #12351d;
      color: #8ff0a4;
      display: none;
    }

    .error {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #3a1414;
      color: #ff9b9b;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Gerador de chaves VAPID</h1>

    <p>
      Gere um par de chaves VAPID para usar no sistema
      de notificações Push.
    </p>

    <button id="generateButton">
      Gerar novas chaves
    </button>

    <label for="publicKey">
      VAPID Public Key
    </label>

    <textarea
      id="publicKey"
      readonly
      placeholder="A chave pública aparecerá aqui..."
    ></textarea>

    <label for="privateKey">
      VAPID Private Key
    </label>

    <textarea
      id="privateKey"
      readonly
      placeholder="A chave privada aparecerá aqui..."
    ></textarea>

    <div id="success" class="success">
      ✅ Chaves VAPID geradas com sucesso.
    </div>

    <div id="error" class="error"></div>

    <div class="warning">
      ⚠️ A VAPID Private Key é secreta.
      Nunca compartilhe essa chave publicamente.
    </div>

  </div>

  <script>
    "use strict";

    const generateButton =
      document.getElementById("generateButton");

    const publicKeyField =
      document.getElementById("publicKey");

    const privateKeyField =
      document.getElementById("privateKey");

    const successMessage =
      document.getElementById("success");

    const errorMessage =
      document.getElementById("error");


    function bytesToBase64Url(bytes) {
      let binary = "";

      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }


    function base64UrlToBytes(value) {
      let base64 = value
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const remainder = base64.length % 4;

      if (remainder === 2) {
        base64 += "==";
      } else if (remainder === 3) {
        base64 += "=";
      } else if (remainder === 1) {
        throw new Error(
          "Base64URL inválido."
        );
      }

      const binary =
        atob(base64);

      const bytes =
        new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] =
          binary.charCodeAt(i);
      }

      return bytes;
    }


    function concatenatePublicKey(x, y) {
      const result =
        new Uint8Array(65);

      result[0] = 0x04;

      result.set(x, 1);

      result.set(y, 33);

      return result;
    }


    async function generateKeys() {
      publicKeyField.value = "";
      privateKeyField.value = "";

      successMessage.style.display = "none";
      errorMessage.style.display = "none";

      try {
        if (
          !window.crypto ||
          !window.crypto.subtle
        ) {
          throw new Error(
            "A criptografia do navegador não está disponível."
          );
        }


        const keyPair =
          await window.crypto.subtle.generateKey(
            {
              name: "ECDSA",
              namedCurve: "P-256"
            },
            true,
            ["sign", "verify"]
          );


        const publicJwk =
          await window.crypto.subtle.exportKey(
            "jwk",
            keyPair.publicKey
          );


        const privateJwk =
          await window.crypto.subtle.exportKey(
            "jwk",
            keyPair.privateKey
          );


        if (
          !publicJwk.x ||
          !publicJwk.y
        ) {
          throw new Error(
            "Não foi possível obter os dados da chave pública."
          );
        }


        if (!privateJwk.d) {
          throw new Error(
            "Não foi possível obter a chave privada."
          );
        }


        const x =
          base64UrlToBytes(
            publicJwk.x
          );

        const y =
          base64UrlToBytes(
            publicJwk.y
          );

        const d =
          base64UrlToBytes(
            privateJwk.d
          );


        if (x.length !== 32) {
          throw new Error(
            "Tamanho inesperado para X da chave pública."
          );
        }

        if (y.length !== 32) {
          throw new Error(
            "Tamanho inesperado para Y da chave pública."
          );
        }

        if (d.length !== 32) {
          throw new Error(
            "Tamanho inesperado para a chave privada."
          );
        }


        const publicKey =
          concatenatePublicKey(
            x,
            y
          );


        publicKeyField.value =
          bytesToBase64Url(
            publicKey
          );


        privateKeyField.value =
          bytesToBase64Url(
            d
          );


        successMessage.style.display =
          "block";

      } catch (error) {

        console.error(error);

        errorMessage.textContent =
          "Erro ao gerar as chaves:\n\n" +
          error.message;

        errorMessage.style.display =
          "block";
      }
    }


    generateButton.addEventListener(
      "click",
      generateKeys
    );
  </script>

</body>
</html>
