<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gerador Push">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Gerador de Notificações</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}
    main{max-width:560px;margin:auto;padding:28px 18px 40px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #0000000d}
    h1{font-size:27px;margin:0 0 6px}.sub{color:#666;margin:0 0 22px}label{display:block;font-weight:600;margin:16px 0 7px}
    input,textarea{width:100%;border:1px solid #ddd;border-radius:13px;padding:13px;font:inherit;background:#fff}textarea{min-height:95px;resize:vertical}
    button{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:18px;background:#111;color:#fff}
    button.secondary{background:#eee;color:#111}.status{margin-top:16px;padding:12px;border-radius:12px;background:#f0f0f2;color:#444;line-height:1.4}
    .preview{margin-top:20px;border:1px solid #e1e1e1;border-radius:18px;padding:14px}.notif{display:flex;gap:12px;align-items:flex-start}
    .icon{width:42px;height:42px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}
    .ntitle{font-weight:700}.ntext{color:#555;margin-top:3px}.small{font-size:12px;color:#888;margin-top:3px}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Gerador de Notificações</h1>
    <p class="sub">Teste uma notificação Push no seu próprio iPhone.</p>

    <label for="sender">Remetente</label>
    <input id="sender" value="Hotmart">

    <label for="title">Título</label>
    <input id="title" value="Nova venda">

    <label for="message">Mensagem</label>
    <textarea id="message">Você realizou uma nova venda.</textarea>

    <button id="installPush">Ativar notificações neste iPhone</button>
    <button id="send" class="secondary">Testar notificação</button>

    <div class="preview">
      <div class="small">Prévia</div>
      <div class="notif">
        <div class="icon">H</div>
        <div>
          <div class="ntitle" id="pTitle">Nova venda</div>
          <div class="ntext" id="pText">Você realizou uma nova venda.</div>
          <div class="small" id="pSender">Hotmart</div>
        </div>
      </div>
    </div>

    <div class="status" id="status">Pronto. Primeiro toque em “Ativar notificações neste iPhone”.</div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
